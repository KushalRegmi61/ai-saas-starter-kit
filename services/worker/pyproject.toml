[project]
name = "ai-saas-worker"
version = "0.1.0"
description = "Minimal background worker for the AI SaaS starter kit"
requires-python = ">=3.11"
# Workspace-local dependency (must match services/shared pyproject `name` so
# the CodeNib graph resolves the edge). Installed as an editable workspace
# member (uv workspace `knowledge-os`; `[tool.uv.sources]` below).
# Imports `shared.*` + `worker.*`.
dependencies = ["ai-saas-shared"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
ai-saas-shared = { workspace = true }

[project.scripts]
worker = "worker.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "T20",  # flake8-print (no bare print())
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default arg (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
