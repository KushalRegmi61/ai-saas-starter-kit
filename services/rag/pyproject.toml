[project]
name = "ai-saas-rag"
version = "0.1.0"
description = "Shared RAG retrieval (+ future direct ingestion) for the AI SaaS starter backend services"
requires-python = ">=3.11"
dependencies = [
    "ai-saas-shared",
    "pydantic>=2",
    "pydantic-settings>=2",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "openai>=1",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "pgvector>=0.3",
    "tenacity>=8.2",
    "python-jose[cryptography]>=3.3",
    "pdfplumber>=0.11",
    "langchain-text-splitters>=0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "T20",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
