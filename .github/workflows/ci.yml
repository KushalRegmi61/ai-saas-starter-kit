name: ci-workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect affected projects
    runs-on: ubuntu-latest
    outputs:
      python_projects: ${{ steps.output.outputs.python_projects }}
      node_projects: ${{ steps.output.outputs.node_projects }}
      docker_projects: ${{ steps.output.outputs.docker_projects }}
      has_python: ${{ steps.output.outputs.has_python }}
      has_node: ${{ steps.output.outputs.has_node }}
      has_docker: ${{ steps.output.outputs.has_docker }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.7'

      - name: Detect affected projects
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/ci/detect_affected.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" > "$RUNNER_TEMP/affected.json"
          cat "$RUNNER_TEMP/affected.json"

      - name: Export matrix outputs
        id: output
        run: |
          affected="$RUNNER_TEMP/affected.json"
          echo "python_projects=$(jq -c '.python_projects' "$affected")" >> "$GITHUB_OUTPUT"
          echo "node_projects=$(jq -c '.node_projects' "$affected")" >> "$GITHUB_OUTPUT"
          echo "docker_projects=$(jq -c '.docker_projects' "$affected")" >> "$GITHUB_OUTPUT"
          echo "has_python=$(jq -r '.has_python' "$affected")" >> "$GITHUB_OUTPUT"
          echo "has_node=$(jq -r '.has_node' "$affected")" >> "$GITHUB_OUTPUT"
          echo "has_docker=$(jq -r '.has_docker' "$affected")" >> "$GITHUB_OUTPUT"

  node-checks:
    name: Node checks (${{ matrix.project.path }})
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.node_projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile --filter "${{ matrix.project.package_name }}"

      - name: Run project checks
        run: ${{ matrix.project.run }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  python-checks:
    name: Python checks (${{ matrix.project.path }})
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.python_projects) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.7'

      - name: Sync project environment
        run: uv sync --frozen --package "${{ matrix.project.package_name }}" --all-groups

      - name: Run project checks
        run: ${{ matrix.project.run }}

  docker-publish:
    name: Publish agent Docker image
    needs: [detect, python-checks]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.has_docker == 'true' &&
      needs.python-checks.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || vars.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kushalregmi61/agentic_assistant
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agentic-assistant/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
