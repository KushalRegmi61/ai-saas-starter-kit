name: CI

# Runs the same quality gates AGENTS.md §5 documents. Without this, those
# gates only ran when a human remembered to. No secrets required: backend
# tests mock the B2 repo layer and /health tolerates a degraded connection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (lint · typecheck · build · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:web

      - name: Typecheck + build
        run: pnpm build
        # next build prerenders the /signin and /signup pages, which construct a
        # Supabase browser client. These NEXT_PUBLIC_* values are public by design
        # (the anon key is publishable) and are only placeholders to let the build
        # succeed as a gate — real values are injected at deploy time.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  api:
    name: API (ruff · pytest · structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync workspace
        run: uv sync --frozen --all-packages --all-groups

      - name: Lint (ruff)
        run: .venv/bin/ruff check services/api libs/rag libs/auth services/shared services/worker

      - name: Tests (pytest)
        run: cd services/api && ../../.venv/bin/python -m pytest

      - name: Structure boundary tests
        run: cd services/api && ../../.venv/bin/python -m pytest tests/test_structure.py -v
